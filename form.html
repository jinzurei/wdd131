
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Product Review</title>
	<meta name="author" content="Tanner Livingston">
	<meta name="description" content="Product review form for WDD 131 by Tanner Livingston. Submit your product feedback and see your review count.">
	<link rel="stylesheet" href="styles/base.css">
	<link rel="stylesheet" href="styles/form.css">
	<link rel="stylesheet" href="styles/form-extras.css">
</head>
<body>
	<header class="form-header">
		<h1>Product Review</h1>
	</header>
	<main>
		<form method="get" action="review.html" autocomplete="on" class="product-form">
			<div class="form-group">
				<label for="productName">Product Name <span class="required" title="Required">*</span></label>
				<select id="productName" name="productName" required>
					<option value="" disabled selected>Select a Product ...</option>
				</select>
			</div>
			<div class="form-group">
				<span class="form-label">Overall Rating <span class="required" title="Required">*</span></span>
				<div class="rating-group">
					<input type="radio" id="star1" name="rating" value="1" required>
					<label for="star1" title="1 star">★</label>
					<input type="radio" id="star2" name="rating" value="2" required>
					<label for="star2" title="2 stars">★★</label>
					<input type="radio" id="star3" name="rating" value="3" required>
					<label for="star3" title="3 stars">★★★</label>
					<input type="radio" id="star4" name="rating" value="4" required>
					<label for="star4" title="4 stars">★★★★</label>
					<input type="radio" id="star5" name="rating" value="5" required>
					<label for="star5" title="5 stars">★★★★★</label>
				</div>
			</div>
			<div class="form-group">
				<label for="installDate">Date of Installation <span class="required" title="Required">*</span></label>
				<input type="date" id="installDate" name="installDate" required>
			</div>
			<div class="form-group">
				<span class="form-label">Which features did you find useful in the product?<br><span class="italic-note">(Check all that apply)</span></span>
				<div class="features-group">
					<input type="checkbox" id="feature1" name="features" value="Durability">
					<label for="feature1">Durability</label>
					<input type="checkbox" id="feature2" name="features" value="Ease of Use">
					<label for="feature2">Ease of Use</label>
					<input type="checkbox" id="feature3" name="features" value="Performance">
					<label for="feature3">Performance</label>
					<input type="checkbox" id="feature4" name="features" value="Design">
					<label for="feature4">Design</label>
				</div>
			</div>
			<div class="form-group">
				<label for="review">Written Review <span class="optional">(Optional)</span></label>
				<textarea id="review" name="review" rows="5"></textarea>
			</div>
			<div class="form-group">
				<label for="userName">Your Name <span class="optional">(Optional)</span></label>
				<input type="text" id="userName" name="userName">
			</div>
			<button type="submit" class="submit-btn">Post Review</button>
		</form>
	</main>
	<footer class="site">
		<p>© <span id="copyright-year"></span> 🐝 Tanner Livingston 🐝 Utah, USA.</p>
		<p id="lastModified"></p>
	</footer>
	<!-- Scripts must be at the very end of body -->
</body>
	<script src="scripts/form.js" defer></script>
	<script src="scripts/form-validation.js" defer></script>
	<script src="scripts/form-enhancements.js" defer></script>
	<script src="scripts/getdates.js" defer></script>
</body>
</html>
