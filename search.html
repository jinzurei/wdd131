<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Digital Herbarium - Search and discover detailed information about plants in your collection">
    <meta name="author" content="Tanner Livingston">
    <title>Digital Herbarium - Plant Search</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@700&family=Fredericka+the+Great&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles/search.css">
</head>
<body>
    <header>
        <button class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>
    
    <nav id="nav">
        <button class="close-nav" id="close-nav">&times;</button>
        <ul>
            <li><a href="search.html">Home</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>
    
    <main>
        <div class="search-container">
            <img src="images/logoDigitalHerbarium.webp" alt="Digital Herbarium Logo" class="site-logo">
            <h1 class="site-title">Digital Herbarium</h1>
            <div class="search-wrapper">
                <div class="search-form">
                    <form id="plant-search" role="search" aria-label="Plant search form">
                        <fieldset>
                            <legend class="visually-hidden">Search for plants by name</legend>
                            <span class="search-icon" id="search-icon" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="binocular-icon" viewBox="0 0 16 16">
                                    <path d="M3 2.5A1.5 1.5 0 0 1 4.5 1h1A1.5 1.5 0 0 1 7 2.5V5h2V2.5A1.5 1.5 0 0 1 10.5 1h1A1.5 1.5 0 0 1 13 2.5v2.382a.5.5 0 0 0 .276.447l.895.447A1.5 1.5 0 0 1 15 7.118V14.5a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 14.5v-3a.5.5 0 0 1 .146-.354l.854-.853V9.5a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v.793l.854.853A.5.5 0 0 1 7 11.5v3A1.5 1.5 0 0 1 5.5 16h-3A1.5 1.5 0 0 1 1 14.5V7.118a1.5 1.5 0 0 1 .83-1.342l.894-.447A.5.5 0 0 0 3 4.882zM4.5 2a.5.5 0 0 0-.5.5V3h2v-.5a.5.5 0 0 0-.5-.5zM6 4H4v.882a1.5 1.5 0 0 1-.83 1.342l-.894.447A.5.5 0 0 0 2 7.118V13h4v-1.293l-.854-.853A.5.5 0 0 1 5 10.5v-1A1.5 1.5 0 0 1 6.5 8h3A1.5 1.5 0 0 1 11 9.5v1a.5.5 0 0 1-.146.354l-.854.853V13h4V7.118a.5.5 0 0 0-.276-.447l-.895-.447A1.5 1.5 0 0 1 12 4.882V4h-2v1.5a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5zm4-1h2v-.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5zm4 11h-4v.5a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5zm-8 0H2v.5a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5z"/>
                                </svg>
                            </span>
                            <label for="plant-input" class="visually-hidden">Enter plant name</label>
                            <input 
                                type="search" 
                                id="plant-input" 
                                name="plant-search" 
                                placeholder="Search for a plant..." 
                                autocomplete="off"
                                aria-label="Search for a plant by common or scientific name"
                                required 
                                minlength="2"
                                aria-describedby="search-help">
                            <span id="search-help" class="visually-hidden">Enter at least 2 characters to search</span>
                            <button type="submit" aria-label="Submit plant search">Search</button>
                        </fieldset>
                    </form>
                </div>
                <div id="results-container" role="listbox" aria-label="Search results"></div>
            </div>
            
            <section class="recent-searches">
                <div class="recent-header">
                    <h2>Recent Searches</h2>
                    <button id="clear-history" class="clear-btn" aria-label="Clear search history">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="trash-icon" viewBox="0 0 16 16">
                            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                            <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                        </svg>
                    </button>
                </div>
                <div id="recent-container"></div>
            </section>
        </div>
    </main>
    
    <footer>
        <video autoplay muted loop playsinline class="footer-video">
            <source src="images/forestbroll.mp4" type="video/mp4">
        </video>
        <div class="footer-content">
            <p>&copy; <span id="currentyear"></span> | Tanner Livingston | WDD 131 Final Project | <a href="sources.html">Sources</a></p>
            <p id="lastModified"></p>
        </div>
    </footer>
    
    <script src="scripts/getdates.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/search.js"></script>
</body>
</html>
